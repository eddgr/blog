<!DOCTYPE html>
<html lang="{% block html_lang %}{{ DEFAULT_LANG }}{% endblock html_lang %}">
    <head>
        {% block head %}
            <title>
                {% block title %}
                    {{ SITENAME|striptags }}
                {% endblock title %}
            </title>
            <meta charset="utf-8" />
            <meta name="generator" content="Pelican" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet"
                  type="text/css"
                  href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/style.css" />
        {% endblock head %}
    </head>
    <body>
        <div class="container">
            {% block body %}
                <main>
                    {% block content %}
                    {% endblock content %}
                </main>
                {% block footer %}
                {% endblock footer %}
            {% endblock body %}
        </div>
    </body>
</html>
